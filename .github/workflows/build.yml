name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Keystore and Env
      run: |
        if [ -f debug.keystore.base64 ]; then
          base64 --decode debug.keystore.base64 > debug.keystore || true
        fi
        if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi
        touch .env

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Optimized Release APK
      run: ./gradlew assembleRelease --stacktrace

    - name: Prepare Fithub APK
      run: |
        mkdir -p build-release
        if ls app/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
          cp app/build/outputs/apk/release/*.apk build-release/Fithub.apk
        else
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/*.apk build-release/Fithub.apk
        fi
        ls -lh build-release/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Fithub-APK
        path: build-release/Fithub.apk
        retention-days: 30

    - name: Clean Old Assets
      run: |
        gh release delete-asset latest app-debug.apk -y || true
        gh release delete-asset latest Fithub.apk -y || true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      continue-on-error: true
      with:
        tag_name: latest
        name: "Fithub Latest APK"
        make_latest: "true"
        overwrite: true
        body: |
          # FITHUB App Latest Release
          
          ### ចុចទីនេះដើម្បីទាញយក Fithub.apk ដោយផ្ទាល់: https://github.com/SithpongRin/FITHUBBB/releases/download/latest/Fithub.apk
          
          ---
          **ការណែនាំ៖**
          * ឯកសារសម្រាប់ដំឡើងលើទូរសព្ទ Android គឺមានតែមួយគត់គឺ **`Fithub.apk`**
          * មិនបាច់ទាញយកឯកសារ Source code (zip) នោះទេ (វាជាកូដប្រភពស្វ័យប្រវត្តរបស់ GitHub)
        files: build-release/Fithub.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
