name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Rename APK for Easy Identification
      run: |
        mkdir -p build-release
        cp app/build/outputs/apk/debug/*.apk build-release/FITHUB-latest.apk

    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FITHUB-latest-apk
        path: build-release/FITHUB-latest.apk
        retention-days: 30

    - name: Automatically Publish/Update GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: latest
        name: "FITHUB Latest APK (Auto-Build)"
        body: |
          ### FITHUB Automated Build
          This APK was built automatically from the latest commit: `${{ github.sha }}`.
          
          **Download the APK file below to install on your Android device!**
        files: build-release/FITHUB-latest.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
