name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK Licenses
      run: |
        yes | sdkmanager --licenses || true

    - name: Restore or Generate Debug Keystore
      run: |
        if [ -f debug.keystore.base64 ]; then
          base64 -d debug.keystore.base64 > debug.keystore || true
        fi
        if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
          echo "Generating new debug.keystore with keytool..."
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi
        touch .env
        ls -la debug.keystore

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Prepare APK for Release
      run: |
        mkdir -p build-release
        cp app/build/outputs/apk/debug/*.apk build-release/FITHUB-latest.apk
        ls -la build-release/

    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FITHUB-latest-apk
        path: build-release/FITHUB-latest.apk
        retention-days: 30

    - name: Automatically Publish/Update GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      continue-on-error: true
      with:
        tag_name: latest
        name: "FITHUB Latest APK (Auto-Build)"
        body: |
          ### FITHUB Automated Build
          This APK was built automatically from commit: `${{ github.sha }}`.
          
          **Download the APK file below to install on your Android device!**
        files: build-release/FITHUB-latest.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
